<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Raw Concrete / Stone Base Gradient from user texture -->
    <linearGradient id="concrete" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D2CFCF"/>
      <stop offset="30%" stop-color="#C2BFBD"/>
      <stop offset="65%" stop-color="#B8B5B3"/>
      <stop offset="100%" stop-color="#A6A2A0"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <!-- Concrete Stone Base with texture details -->
  <g clip-path="url(#squircle)">
    <rect width="64" height="64" fill="url(#concrete)"/>
    <!-- Concrete grain layers -->
    <path d="M0 10 Q18 16 34 12 T64 15 L64 32 Q44 26 24 34 T0 28 Z" fill="#B0ACA9" opacity="0.45"/>
    <path d="M8 4 Q20 1 36 6 T56 3 L62 22 Q38 18 18 25 Z" fill="#DFDCDB" opacity="0.4"/>
    <circle cx="17" cy="21" r="1.5" fill="#75716E" opacity="0.55"/>
    <circle cx="46" cy="13" r="1.2" fill="#696562" opacity="0.45"/>
    <circle cx="51" cy="41" r="1.8" fill="#75716E" opacity="0.5"/>
    <circle cx="13" cy="47" r="1.3" fill="#696562" opacity="0.55"/>
    <circle cx="33" cy="53" r="1.5" fill="#827E7B" opacity="0.45"/>
    <path d="M7 34 Q13 41 11 49" stroke="#75716E" stroke-width="0.9" fill="none" opacity="0.45"/>
    <path d="M47 21 Q53 27 49 34" stroke="#75716E" stroke-width="0.9" fill="none" opacity="0.4"/>
  </g>

  <!-- Brutalist Heavy Solid Black Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- 'L' in Solid Black (Half Black) -->
  <path d="M 13 16 H 22 V 40 H 32 V 48 H 13 Z" fill="#111111"/>

  <!-- 'F' in Vibrant Electric Neon Lime (Half Neon) -->
